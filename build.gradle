import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.KotlinJvm

plugins {
    id 'java'
    id 'antlr'
    id 'maven-publish'
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.dokka)
    alias(libs.plugins.maven.publish)
}

group = 'org.infosmid'
def getVersionFromFile() {
    def versionFile = new File(rootProject.projectDir, 'version.txt')
    return versionFile.text.trim()
}
version = providers.gradleProperty('releaseVersion').getOrNull() ?: getVersionFromFile()

def projectName = 'KFSM Visualization'
def projectDescription = 'Visualization library for KFSM finite state-machine definitions'
description = projectDescription

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    antlr libs.antlr.tool
    api libs.antlr.runtime

    testImplementation libs.junit
    testImplementation libs.kfsm.jvm
}

// The antlr plugin adds the generator to 'api', which would publish it. Only the runtime is needed by consumers.
configurations.named('api') {
    setExtendsFrom(extendsFrom.findAll { it.name != 'antlr' })
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

tasks.withType(Jar).matching { it.name == 'sourcesJar' }.configureEach {
    // ANTLR writes .interp/.tokens files into the generated source directory as well
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def grammarOutputDir = layout.buildDirectory.dir('generated-src/antlr/main')

tasks.named('generateGrammarSource', AntlrTask) {
    arguments += ['-package', 'org.infosmid.kfsm.viz.grammar', '-visitor',
                  '-lib', file('src/main/antlr/org/infosmid/kfsm/viz/grammar').absolutePath]
    outputDirectory = grammarOutputDir.get().asFile
}

sourceSets.main.java.srcDir grammarOutputDir

tasks.named('compileKotlin') {
    dependsOn tasks.named('generateGrammarSource')
}

publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/infosmid-org/${rootProject.name}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').getOrElse('')
                password = providers.environmentVariable('GITHUB_TOKEN').getOrElse('')
            }
        }
    }
}

mavenPublishing {
    configure(new KotlinJvm(new JavadocJar.Dokka('dokkaGeneratePublicationHtml'), true))
    publishToMavenCentral()
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }
    coordinates(project.group.toString(), rootProject.name, project.version.toString())
    pom {
        name = projectName
        description = projectDescription
        inceptionYear = '2020'
        url = "https://github.com/infosmid-org/${rootProject.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'corneil'
                name = 'Corneil du Plessis'
                url = 'https://github.com/corneil'
            }
        }
        scm {
            url = "https://github.com/infosmid-org/${rootProject.name}"
            connection = "scm:git:git://github.com/infosmid-org/${rootProject.name}.git"
            developerConnection = "scm:git:ssh://git@github.com/infosmid-org/${rootProject.name}.git"
        }
        issueManagement {
            system = 'GitHub'
            url = "https://github.com/infosmid-org/${rootProject.name}/issues"
        }
    }
}
